name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Linux: the hermetic run AGENTS.md describes ──────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System packages (Lua for the companion, headers for PyGObject and evdev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 libgirepository-2.0-dev libcairo2-dev pkg-config

      - name: Python packages
        run: python -m pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Tests
        # A scratch HOME (config, tokens) and stub PipeWire / playerctl tools,
        # so nothing reaches a real audio session or player.
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/stubs"
          for t in pactl wpctl pw-link pw-play pw-cli pw-dump playerctl; do
            printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/stubs/$t"
            chmod +x "$RUNNER_TEMP/stubs/$t"
          done
          HOME="$RUNNER_TEMP/home" PATH="$RUNNER_TEMP/stubs:$PATH" python -m pytest tests -q

  # ── Windows: the same suite on real Windows, Python as install.ps1 installs it ─
  windows:
    runs-on: windows-latest
    timeout-minutes: 30               # a hang must not hold a runner for six hours
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Lua 5.1 runs the companion addon in its tests; without it they skip.
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: leafo/gh-actions-lua@v11
        continue-on-error: true
        with:
          luaVersion: "5.1.5"
      - name: Lua under the name the tests look for
        run: |
          if command -v lua >/dev/null; then cp "$(command -v lua).exe" "$(dirname "$(command -v lua)")/lua5.1.exe" || true; fi
          command -v lua5.1 || echo "No Lua: the companion tests will skip"

      # Windows PowerShell 5.1 is what the app's update runs it with.
      - name: install.ps1 parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }

      - name: Python packages
        run: python -m pip install -r requirements.txt pytest pytest-asyncio httpx

      # %APPDATA% holds the app's config and tokens: a scratch one, set before
      # server.py is imported. No PYTHONUTF8: the app must not depend on it.
      - name: WoW and live link tests
        run: |
          mkdir -p "$RUNNER_TEMP/appdata"
          APPDATA="$(cygpath -w "$RUNNER_TEMP/appdata")" python -m pytest tests/test_wow.py tests/test_wow_layout.py \
            tests/test_wow_link.py tests/test_wow_screen.py tests/test_wow_screen_win.py tests/test_wow_companion.py -q \
            -o faulthandler_timeout=60  # a test stuck for a minute prints every thread's stack

      # WoW's window read for real: a stand-in window through WGC and GDI. A
      # runner without WGC would skip those tests and say so in the summary.
      - name: Windows capture against a stand-in WoW window
        run: APPDATA="$(cygpath -w "$RUNNER_TEMP/appdata")" python -m pytest tests/test_wow_windows_live.py -v -rs

      - name: Everything else
        run: APPDATA="$(cygpath -w "$RUNNER_TEMP/appdata")" python -m pytest tests -q
