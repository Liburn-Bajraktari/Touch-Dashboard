when:
  - event: push
    branch: main

steps:
  publish-aur:
    image: archlinux:base-devel
    secrets: [ aur_ssh_private_key ]
    commands:
      # 1. Setup minimal dependencies
      - pacman -Syu --noconfirm git openssh sudo pacman-contrib

      # 2. Setup build user (makepkg cannot run as root)
      - useradd -m builduser
      - echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser
      - chown -R builduser:builduser .

      # 3. Setup SSH for AUR access
      - mkdir -p /home/builduser/.ssh
      - echo "$AUR_SSH_PRIVATE_KEY" > /home/builduser/.ssh/id_rsa
      - chmod 600 /home/builduser/.ssh/id_rsa
      - ssh-keyscan aur.archlinux.org >> /home/builduser/.ssh/known_hosts
      - chown -R builduser:builduser /home/builduser/.ssh

      # 4. Setup Git config
      - sudo -u builduser git config --global user.name "Woodpecker CI"
      - sudo -u builduser git config --global user.email "ci@codeberg.org"

      # 5. Generate Checksums and .SRCINFO dynamically
      - sudo -u builduser bash -c "updpkgsums"
      - sudo -u builduser bash -c "makepkg --printsrcinfo > .SRCINFO"

      # 6. Clone AUR repo and prepare commit
      - sudo -u builduser git clone ssh://aur@aur.archlinux.org/touch-dashboard.git /tmp/aur-repo
      - sudo -u builduser cp PKGBUILD .SRCINFO /tmp/aur-repo/
      - cd /tmp/aur-repo

      # 7. Push to AUR
      - sudo -u builduser git add PKGBUILD .SRCINFO
      - sudo -u builduser git commit -m "Update from CI (Codeberg commit ${CI_COMMIT_SHA})" || true
      - sudo -u builduser git push origin master
