<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>

    <!-- Pointing to the new dynamic backend manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #090e17;
            --panel-bg: rgba(15, 23, 42, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
        html { font-size: clamp(12px, 1.2vw, 18px); }

        body {
            margin: 0; padding: 1.5rem;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #111827 100%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; gap: 1.5rem;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 1.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; flex: 0 0 4rem; }
        .section { display: flex; align-items: center; gap: 1.5rem; }
        .batt { color: var(--accent); font-weight: 600; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem;}
        .speed-data { text-align: right; font-size: 0.9rem; color: var(--text-muted); line-height: 1.2;}
        .speed-data span { color: var(--text-main); font-weight: 600; }

        .grid-container { display: grid; grid-template-columns: 1.2fr 1.5fr 1fr; gap: 1.5rem; flex: 1; min-height: 0; }
        .panel { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

        .btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem; color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.15s ease; height: 100%;
        }
        .btn:active { transform: scale(0.92); background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); color: #000; }
        .btn-top { width: 4rem; height: 3.5rem; }
        .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; flex: 0 0 5rem; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; flex: 0 0 10rem;}

        .header-widget { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; flex: 0 0 8rem; }
        .widget-box { background: rgba(0,0,0,0.2); border-radius: 1rem; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #time { font-size: 3.5rem; font-weight: 700; letter-spacing: -2px; }
        #date { color: var(--accent); font-weight: 500; font-size: 1.2rem; }

        .spotify { flex: 1; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 1rem; display: flex; flex-direction: column; justify-content: center;}
        #spot-title { font-size: 1.4rem; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #spot-artist { color: var(--text-muted); font-size: 1.1rem; }
        .spot-ctrl { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 1rem; margin-top: 1.5rem; height: 4rem; }

        /* --- Custom Pro Fader Sliders --- */
        .slider-section { display: flex; justify-content: space-between; align-items: stretch; flex: 1; padding-top: 1rem; gap: 2rem; }

        .pro-slider {
            position: relative; flex: 1; max-width: 5.5rem; height: 100%;
            background: rgba(0,0,0,0.4); border-radius: 1.5rem;
            overflow: hidden; cursor: pointer;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
        }
        .slider-fill {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(0deg, #0284c7 0%, var(--accent) 100%);
            box-shadow: 0 -5px 15px var(--accent-glow);
            pointer-events: none; /* Let touches pass through to the parent container */
        }
        .slider-val {
            position: absolute; top: 1rem; font-weight: 700; font-size: 1.1rem;
            color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none;
        }
        .slider-icon {
            position: absolute; bottom: 1rem; background: rgba(0,0,0,0.5);
            border-radius: 50%; width: 3rem; height: 3rem;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); z-index: 2; transition: all 0.2s;
        }
        .slider-icon:active { background: var(--accent); color: black; transform: scale(0.9); }

        .audio-switch { display: flex; flex-direction: column; justify-content: flex-end; gap: 1rem; flex: 1; }

        .stat-row { display: flex; align-items: center; gap: 1rem; font-size: 1.5rem; margin-top: 1rem; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 1rem;}
        .stat-row i { color: var(--accent); width: 2rem; height: 2rem; }
        .stat-val { font-weight: 700; margin-left: auto; }

        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 999;
            justify-content: center; align-items: center;
        }
        .modal-card { background: #0f172a; padding: 3rem; border-radius: 1.5rem; width: 40rem; border: 1px solid var(--border); }
        .modal-card input { width: 100%; padding: 1rem; margin: 0.5rem 0 2rem; border-radius: 0.5rem; border: none; background: #1e293b; color: white; font-size: 1.2rem;}
        .modal-card h2 { margin-top: 0; color: var(--accent); }
    </style>
</head>
<body id="body">

    <div id="modal">
        <div class="modal-card">
            <h2>Configuration</h2>
            <label>OpenWeather API Key</label><input type="text" id="cfg-weather" placeholder="Enter API Key...">
            <label>City</label><input type="text" id="cfg-city" placeholder="Pristina">
            <hr style="border-color: var(--border); margin: 1.5rem 0;">
            <label>Spotify Client ID</label><input type="text" id="cfg-spot-id" placeholder="Spotify Dev Client ID">
            <label>Spotify Client Secret</label><input type="password" id="cfg-spot-secret" placeholder="Spotify Dev Client Secret">
            <button class="btn" style="width: 100%; background: var(--accent); color: #000; font-weight: bold; height: 4rem;" onclick="saveConfig()">Save Settings</button>
        </div>
    </div>

    <div class="top-bar glass">
        <div class="section batt"><i data-lucide="mouse"></i> <span id="mouse-batt">--%</span></div>
        <div class="section" style="letter-spacing: 4px; font-weight: 300; font-size: 1.2rem; color: var(--text-muted);">COMMAND CENTER</div>
        <div class="section">
            <div class="speed-data" id="speed-out">DL <span id="s-dl">--</span><br>UL <span id="s-ul">--</span></div>
            <button class="btn btn-top" onclick="runSpeedtest()"><i data-lucide="activity"></i></button>
            <button class="btn btn-top" onclick="toggleFullscreen()"><i data-lucide="maximize"></i></button>
            <button class="btn btn-top" style="color: #ef4444;"><i data-lucide="power"></i></button>
        </div>
    </div>

    <div class="grid-container">
        <!-- Left Column -->
        <div class="panel glass">
            <div class="header-widget">
                <div class="widget-box"><div id="time">00:00</div><div id="date">--</div></div>
                <div class="widget-box"><i data-lucide="cloud" style="width: 3rem; height: 3rem; color: var(--accent);"></i><div id="w-temp" style="font-size: 2rem; font-weight: bold; margin-top: 0.5rem;">--°</div><div id="w-desc" style="color: var(--text-muted);">--</div></div>
            </div>
            <div class="btn-row">
                <button class="btn" onclick="act('disc_mute')"><i data-lucide="mic-off"></i></button>
                <button class="btn" onclick="act('disc_deaf')"><i data-lucide="headphones"></i></button>
                <button class="btn" onclick="act('disc_cam')"><i data-lucide="video"></i></button>
                <button class="btn" onclick="act('disc_screen')"><i data-lucide="monitor-up"></i></button>
            </div>
            <div class="spotify">
                <span id="spot-title">Nothing Playing</span><span id="spot-artist">--</span>
                <div class="spot-ctrl">
                    <button class="btn" onclick="act('spot_prev')"><i data-lucide="skip-back"></i></button>
                    <button class="btn" onclick="act('spot_play')"><i data-lucide="play"></i></button>
                    <button class="btn" onclick="act('spot_next')"><i data-lucide="skip-forward"></i></button>
                </div>
            </div>
        </div>

        <!-- Center Column -->
        <div class="panel glass">
            <div class="btn-grid">
                <button class="btn" onclick="act('app_clip')"><i data-lucide="clapperboard"></i></button>
                <button class="btn" onclick="act('app_soundpad')"><i data-lucide="music"></i></button>
                <button class="btn" onclick="act('app_term')"><i data-lucide="terminal"></i></button>
                <button class="btn" onclick="act('app_web')"><i data-lucide="globe"></i></button>
                <button class="btn" onclick="act('app_task')"><i data-lucide="cpu"></i></button>
                <button class="btn" style="opacity: 0.1; cursor: default;"></button>
            </div>

            <div class="slider-section">
                <!-- Pro Speaker Slider -->
                <div class="pro-slider" id="slide-spk">
                    <div class="slider-val" id="val-spk">50%</div>
                    <div class="slider-fill" id="fill-spk"></div>
                    <!-- Icon acts as an independent mute button -->
                    <div class="slider-icon" onclick="event.stopPropagation(); act('audio_mute_spk')"><i data-lucide="volume-2"></i></div>
                </div>

                <div class="audio-switch">
                    <button class="btn" style="height: 6rem; font-weight: bold; letter-spacing: 1px;" onclick="act('audio_xonar')">XONAR</button>
                    <button class="btn" style="height: 6rem; font-weight: bold; letter-spacing: 1px;" onclick="act('audio_mobius')">MOBIUS</button>
                </div>

                <!-- Pro Mic Slider -->
                <div class="pro-slider" id="slide-mic">
                    <div class="slider-val" id="val-mic">80%</div>
                    <div class="slider-fill" id="fill-mic" style="height: 80%;"></div>
                    <div class="slider-icon" onclick="event.stopPropagation(); act('audio_mute_mic')"><i data-lucide="mic"></i></div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="panel glass">
            <h3 style="color: var(--text-muted); margin: 0 0 1rem 0; font-size: 1.5rem;">System Monitor</h3>
            <div class="stat-row"><i data-lucide="cpu"></i> CPU <span class="stat-val" id="sys-cpu">0%</span></div>
            <div class="stat-row"><i data-lucide="memory-stick"></i> RAM <span class="stat-val" id="sys-ram">0%</span></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const socket = io();

        // --- Fullscreen API ---
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- Custom Pro Slider Logic ---
        function initSlider(sliderId, fillId, valId, type) {
            const slider = document.getElementById(sliderId);
            const fill = document.getElementById(fillId);
            const valText = document.getElementById(valId);
            let isDragging = false;

            function update(e) {
                const rect = slider.getBoundingClientRect();
                let clientY = e.touches ? e.touches[0].clientY : e.clientY;
                // Calculate percentage from bottom to top
                let percent = 100 - (((clientY - rect.top) / rect.height) * 100);
                percent = Math.max(0, Math.min(100, Math.round(percent))); // Clamp 0-100

                fill.style.height = percent + '%';
                valText.innerText = percent + '%';

                // Only send to backend every few ms during drag to prevent flooding
                socket.emit('set_volume', {type: type, val: percent});
            }

            // Mouse Events
            slider.addEventListener('mousedown', (e) => { isDragging = true; update(e); });
            document.addEventListener('mousemove', (e) => { if(isDragging) update(e); });
            document.addEventListener('mouseup', () => { isDragging = false; });

            // Touch Events (Passive: false allows us to prevent screen scrolling while dragging)
            slider.addEventListener('touchstart', (e) => { e.preventDefault(); update(e); }, {passive: false});
            slider.addEventListener('touchmove', (e) => { e.preventDefault(); update(e); }, {passive: false});
        }

        // Initialize both sliders
        initSlider('slide-spk', 'fill-spk', 'val-spk', 'speaker');
        initSlider('slide-mic', 'fill-mic', 'val-mic', 'mic');

        // --- Standard Logic ---
        setInterval(() => {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
        }, 1000);

        let lastTap = 0;
        document.getElementById('body').addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTap < 300 && currentTime - lastTap > 0) {
                document.getElementById('modal').style.display = 'flex';
                loadConfig();
            }
            lastTap = currentTime;
        });

        function loadConfig() {
            document.getElementById('cfg-weather').value = localStorage.getItem('w_api') || '';
            document.getElementById('cfg-city').value = localStorage.getItem('w_city') || 'Pristina';
            document.getElementById('cfg-spot-id').value = localStorage.getItem('s_id') || '';
            document.getElementById('cfg-spot-secret').value = localStorage.getItem('s_secret') || '';
        }

        function saveConfig() {
            const data = {
                weather_api: document.getElementById('cfg-weather').value,
                weather_city: document.getElementById('cfg-city').value,
                spot_id: document.getElementById('cfg-spot-id').value,
                spot_secret: document.getElementById('cfg-spot-secret').value
            };
            localStorage.setItem('w_api', data.weather_api);
            localStorage.setItem('w_city', data.weather_city);
            localStorage.setItem('s_id', data.spot_id);
            localStorage.setItem('s_secret', data.spot_secret);
            socket.emit('save_config', data);
            document.getElementById('modal').style.display = 'none';
        }

        window.onload = () => { socket.emit('save_config', { weather_api: localStorage.getItem('w_api'), weather_city: localStorage.getItem('w_city'), spot_id: localStorage.getItem('s_id'), spot_secret: localStorage.getItem('s_secret')}); }

        function act(action) { socket.emit('action', action); }
        function runSpeedtest() { document.getElementById('s-dl').innerText = "..."; document.getElementById('s-ul').innerText = "..."; socket.emit('run_speedtest'); }

        socket.on('sys_data', (data) => {
            document.getElementById('sys-cpu').innerText = data.cpu + '%';
            document.getElementById('sys-ram').innerText = data.ram + '%';
            document.getElementById('mouse-batt').innerText = data.mouse_batt + '%';
            document.getElementById('spot-title').innerText = data.spotify.title;
            document.getElementById('spot-artist').innerText = data.spotify.artist;
        });
        socket.on('weather_data', (data) => { document.getElementById('w-temp').innerText = data.temp + '°'; document.getElementById('w-desc').innerText = data.desc; });
        socket.on('speedtest_result', (data) => { document.getElementById('s-dl').innerText = data.down; document.getElementById('s-ul').innerText = data.up; });
    </script>
</body>
</html>
