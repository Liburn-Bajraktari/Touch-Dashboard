<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-dark: #090e17; --panel-bg: rgba(15, 23, 42, 0.4); --border: rgba(255, 255, 255, 0.08);
            --accent: #0ea5e9; --accent-glow: rgba(14, 165, 233, 0.4);
            --danger: #ef4444; --danger-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f8fafc; --text-muted: #64748b;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
        html { font-size: clamp(12px, 1.2vw, 18px); }

        body {
            margin: 0; padding: 1.5rem;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #111827 100%); color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column; gap: 1.5rem;
        }

        .glass {
            background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 1.5rem; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; flex: 0 0 4rem; }
        .section { display: flex; align-items: center; gap: 1.5rem; }
        .batt { color: var(--accent); font-weight: 600; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem;}
        .speed-data { text-align: right; font-size: 0.9rem; color: var(--text-muted); line-height: 1.2;}
        .speed-data span { color: var(--text-main); font-weight: 600; }

        .grid-container { display: grid; grid-template-columns: 1.2fr 1.5fr 1fr; gap: 1.5rem; flex: 1; min-height: 0; }
        .panel { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

        .btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem; color: var(--text-main); display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.15s ease; height: 100%;
        }
        .btn:active { transform: scale(0.92); background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); color: #000; }
        .btn-top { width: 4rem; height: 3.5rem; }
        .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; flex: 0 0 5rem; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; flex: 0 0 10rem;}

        .header-widget { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; flex: 0 0 8rem; }
        .widget-box { background: rgba(0,0,0,0.2); border-radius: 1rem; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #time { font-size: 3.5rem; font-weight: 700; letter-spacing: -2px; }
        #date { color: var(--accent); font-weight: 500; font-size: 1.2rem; }

        .spotify { flex: 1; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 1rem; display: flex; flex-direction: column; justify-content: center;}
        #spot-title { font-size: 1.4rem; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #spot-artist { color: var(--text-muted); font-size: 1.1rem; }
        .spot-ctrl { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 1rem; margin-top: 1.5rem; height: 4rem; }

        /* Sliders */
        .slider-section { display: flex; justify-content: space-around; align-items: stretch; flex: 1; padding-top: 1rem; }
        .pro-slider {
            position: relative; flex: 0 0 5.5rem; height: 100%; background: rgba(0,0,0,0.4); border-radius: 1.5rem;
            overflow: hidden; cursor: pointer; box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
        }
        .slider-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(0deg, #0284c7 0%, var(--accent) 100%); box-shadow: 0 -5px 15px var(--accent-glow); pointer-events: none; z-index: 1; }
        .slider-val { position: absolute; top: 1.5rem; font-weight: 800; font-size: 1.2rem; color: #ffffff; text-shadow: 0px 2px 4px rgba(0,0,0,0.9); pointer-events: none; z-index: 10; }
        .slider-icon {
            position: absolute; bottom: 1rem; background: rgba(0,0,0,0.5); border-radius: 50%; width: 3.5rem; height: 3.5rem;
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); z-index: 10; transition: all 0.2s;
        }
        .slider-icon.muted { background: var(--danger); box-shadow: 0 0 15px var(--danger-glow); color: #000; }
        .slider-icon:active { transform: scale(0.9); }

        .audio-switch { display: flex; flex-direction: column; justify-content: flex-end; flex: 0 0 8rem; }
        .stat-row { display: flex; align-items: center; gap: 1rem; font-size: 1.5rem; margin-top: 1rem; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 1rem;}
        .stat-row i { color: var(--accent); width: 2rem; height: 2rem; }
        .stat-val { font-weight: 700; margin-left: auto; }

        /* --- Settings UI Redesign --- */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 999; justify-content: center; align-items: center; }
        .modal-card { background: #0f172a; padding: 2rem; border-radius: 1.5rem; width: 45rem; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 1rem;}
        .tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .tab { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; font-weight: bold; cursor: pointer; padding: 0.5rem 1rem; transition: 0.2s; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .tab-content { display: none; flex-direction: column; gap: 1rem; padding-top: 1rem; }
        .tab-content.active { display: flex; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;}
        input, select { width: 100%; padding: 1rem; border-radius: 0.5rem; border: none; background: #1e293b; color: white; font-size: 1.1rem; outline: none; }
        .hw-row { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; align-items: center; }
    </style>
</head>
<body id="body">

    <!-- Tabbed Settings Modal -->
    <div id="modal">
        <div class="modal-card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('tab-gen')">Integrations</button>
                <button class="tab" onclick="switchTab('tab-aud')">Audio Routing</button>
            </div>

            <!-- Integrations Tab -->
            <div id="tab-gen" class="tab-content active">
                <div class="hw-row">
                    <div class="form-group"><label>Weather API Key</label><input type="text" id="cfg-weather"></div>
                    <div class="form-group"><label>City</label><input type="text" id="cfg-city"></div>
                </div>
                <div class="form-group"><label>Spotify Client ID</label><input type="text" id="cfg-spot-id"></div>
                <div class="form-group"><label>Spotify Client Secret</label><input type="password" id="cfg-spot-secret"></div>
            </div>

            <!-- Audio Routing Tab -->
            <div id="tab-aud" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0;">Map your hardware devices to the UI Cycle button.</p>
                    <button class="btn" style="height: 2.5rem; padding: 0 1rem; font-size: 0.9rem;" onclick="socket.emit('request_hw_scan')"><i data-lucide="refresh-cw" style="width: 1rem; margin-right: 0.5rem;"></i> Scan Hardware</button>
                </div>
                
                <div class="hw-row">
                    <div class="form-group"><label>Device Slot 1 Hardware</label><select id="cfg-s1-hw"></select></div>
                    <div class="form-group"><label>UI Display Name</label><input type="text" id="cfg-s1-name" placeholder="e.g. XONAR"></div>
                </div>
                
                <div class="hw-row">
                    <div class="form-group"><label>Device Slot 2 Hardware</label><select id="cfg-s2-hw"></select></div>
                    <div class="form-group"><label>UI Display Name</label><input type="text" id="cfg-s2-name" placeholder="e.g. MOBIUS"></div>
                </div>
            </div>

            <button class="btn" style="background: var(--accent); color: #000; font-weight: bold; height: 4rem; margin-top: 1rem;" onclick="saveConfig()">Save & Apply</button>
        </div>
    </div>

    <!-- UI Core -->
    <div class="top-bar glass">
        <div class="section batt"><i data-lucide="mouse"></i> <span id="mouse-batt">--%</span></div>
        <div class="section" style="letter-spacing: 4px; font-weight: 300; font-size: 1.2rem; color: var(--text-muted);">COMMAND CENTER</div>
        <div class="section">
            <div class="speed-data" id="speed-out">DL <span id="s-dl">--</span><br>UL <span id="s-ul">--</span></div>
            <button class="btn btn-top" onclick="runSpeedtest()"><i data-lucide="activity"></i></button>
            <button class="btn btn-top" onclick="toggleFullscreen()"><i data-lucide="maximize"></i></button>
            <button class="btn btn-top" style="color: #ef4444;"><i data-lucide="power"></i></button>
        </div>
    </div>

    <div class="grid-container">
        <!-- Left Column -->
        <div class="panel glass">
            <div class="header-widget">
                <div class="widget-box"><div id="time">00:00</div><div id="date">--</div></div>
                <div class="widget-box"><i data-lucide="cloud" style="width: 3rem; height: 3rem; color: var(--accent);"></i><div id="w-temp" style="font-size: 2rem; font-weight: bold; margin-top: 0.5rem;">--°</div><div id="w-desc" style="color: var(--text-muted);">--</div></div>
            </div>
            <div class="btn-row">
                <button class="btn" onclick="act('disc_mute')"><i data-lucide="mic-off"></i></button>
                <button class="btn" onclick="act('disc_deaf')"><i data-lucide="headphones"></i></button>
                <button class="btn" onclick="act('disc_cam')"><i data-lucide="video"></i></button>
                <button class="btn" onclick="act('disc_screen')"><i data-lucide="monitor-up"></i></button>
            </div>
            <div class="spotify">
                <span id="spot-title">Connecting...</span><span id="spot-artist">--</span>
                <div class="spot-ctrl">
                    <button class="btn" onclick="act('spot_prev')"><i data-lucide="skip-back"></i></button>
                    <button class="btn" onclick="act('spot_play')"><i data-lucide="play"></i></button>
                    <button class="btn" onclick="act('spot_next')"><i data-lucide="skip-forward"></i></button>
                </div>
            </div>
        </div>

        <!-- Center Column -->
        <div class="panel glass">
            <div class="btn-grid">
                <button class="btn" onclick="act('app_clip')"><i data-lucide="clapperboard"></i></button>
                <button class="btn" onclick="act('app_soundpad')"><i data-lucide="music"></i></button>
                <button class="btn" onclick="act('app_term')"><i data-lucide="terminal"></i></button>
                <button class="btn" onclick="act('app_web')"><i data-lucide="globe"></i></button>
                <button class="btn" onclick="act('app_task')"><i data-lucide="cpu"></i></button>
                <button class="btn" style="opacity: 0.1; cursor: default;"></button>
            </div>

            <div class="slider-section">
                <div class="pro-slider" id="slide-spk">
                    <div class="slider-val" id="val-spk">0%</div>
                    <div class="slider-fill" id="fill-spk"></div>
                    <div class="slider-icon" id="icon-spk" onclick="event.stopPropagation(); act('audio_mute_spk')"><i data-lucide="volume-2"></i></div>
                </div>

                <div class="audio-switch">
                    <button class="btn" id="btn-audio-cycle" style="height: 6rem; font-weight: bold; letter-spacing: 2px; font-size: 1.2rem; background: rgba(0,0,0,0.3);" onclick="act('audio_cycle')">DEVICE</button>
                </div>

                <div class="pro-slider" id="slide-mic">
                    <div class="slider-val" id="val-mic">0%</div>
                    <div class="slider-fill" id="fill-mic"></div>
                    <div class="slider-icon" id="icon-mic" onclick="event.stopPropagation(); act('audio_mute_mic')"><i data-lucide="mic"></i></div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="panel glass">
            <h3 style="color: var(--text-muted); margin: 0 0 1rem 0; font-size: 1.5rem;">System Monitor</h3>
            <div class="stat-row"><i data-lucide="cpu"></i> CPU <span class="stat-val" id="sys-cpu">0%</span></div>
            <div class="stat-row"><i data-lucide="memory-stick"></i> RAM <span class="stat-val" id="sys-ram">0%</span></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const socket = io();

        // --- Tabs Logic ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // --- Hardware UI Syncing ---
        function populateHwDropdowns(devices) {
            const s1 = document.getElementById('cfg-s1-hw');
            const s2 = document.getElementById('cfg-s2-hw');
            s1.innerHTML = ''; s2.innerHTML = '';
            devices.forEach(d => {
                const opt1 = new Option(d.name, d.id);
                const opt2 = new Option(d.name, d.id);
                s1.add(opt1); s2.add(opt2);
            });
        }

        socket.on('config_sync', (data) => {
            // Fill Dropdowns
            populateHwDropdowns(data.hw);
            
            // Fill Fields
            const c = data.cfg;
            document.getElementById('cfg-weather').value = c.weather_api;
            document.getElementById('cfg-city').value = c.weather_city;
            document.getElementById('cfg-spot-id').value = c.spot_id;
            document.getElementById('cfg-spot-secret').value = c.spot_secret;
            
            // Set Dropdown Selectors
            if(c.audio_slot_1.id) document.getElementById('cfg-s1-hw').value = c.audio_slot_1.id;
            document.getElementById('cfg-s1-name').value = c.audio_slot_1.name;
            if(c.audio_slot_2.id) document.getElementById('cfg-s2-hw').value = c.audio_slot_2.id;
            document.getElementById('cfg-s2-name').value = c.audio_slot_2.name;
        });

        socket.on('hw_scan_results', (devices) => {
            populateHwDropdowns(devices);
            alert("Hardware list updated!");
        });

        function saveConfig() {
            socket.emit('save_config', {
                weather_api: document.getElementById('cfg-weather').value,
                weather_city: document.getElementById('cfg-city').value,
                spot_id: document.getElementById('cfg-spot-id').value,
                spot_secret: document.getElementById('cfg-spot-secret').value,
                audio_slot_1: { id: document.getElementById('cfg-s1-hw').value, name: document.getElementById('cfg-s1-name').value },
                audio_slot_2: { id: document.getElementById('cfg-s2-hw').value, name: document.getElementById('cfg-s2-name').value }
            });
            document.getElementById('modal').style.display = 'none';
        }

        // --- Standard UI Logic ---
        let isDraggingSpk = false; let isDraggingMic = false;
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>e); else if (document.exitFullscreen) document.exitFullscreen(); }

        function initSlider(sId, fId, vId, type, dCheck) {
            const s = document.getElementById(sId), f = document.getElementById(fId), v = document.getElementById(vId);
            function set(pct) { f.style.height = pct + '%'; v.innerText = pct + '%'; }
            function drag(e) {
                const r = s.getBoundingClientRect();
                let pct = 100 - ((((e.touches ? e.touches[0].clientY : e.clientY) - r.top) / r.height) * 100);
                pct = Math.max(0, Math.min(100, Math.round(pct)));
                set(pct); socket.emit('set_volume', {type: type, val: pct});
            }
            s.addEventListener('mousedown', (e) => { dCheck(true); drag(e); });
            document.addEventListener('mousemove', (e) => { if(dCheck()) drag(e); });
            document.addEventListener('mouseup', () => dCheck(false));
            s.addEventListener('touchstart', (e) => { e.preventDefault(); dCheck(true); drag(e); }, {passive: false});
            s.addEventListener('touchmove', (e) => { e.preventDefault(); drag(e); }, {passive: false});
            s.addEventListener('touchend', () => dCheck(false));
            return (ext) => { if(!dCheck()) set(ext); };
        }

        const upSpk = initSlider('slide-spk', 'fill-spk', 'val-spk', 'speaker', (v) => { if(v!==undefined) isDraggingSpk = v; return isDraggingSpk; });
        const upMic = initSlider('slide-mic', 'fill-mic', 'val-mic', 'mic', (v) => { if(v!==undefined) isDraggingMic = v; return isDraggingMic; });

        let lastTap = 0;
        document.getElementById('body').addEventListener('touchend', (e) => {
            const cur = new Date().getTime();
            if (cur - lastTap < 300 && cur - lastTap > 0) document.getElementById('modal').style.display = 'flex';
            lastTap = cur;
        });

        function act(a) { socket.emit('action', a); }
        function runSpeedtest() { document.getElementById('s-dl').innerText = "..."; document.getElementById('s-ul').innerText = "..."; socket.emit('run_speedtest'); }

        socket.on('sys_data', (d) => {
            document.getElementById('sys-cpu').innerText = d.cpu + '%';
            document.getElementById('sys-ram').innerText = d.ram + '%';
            document.getElementById('mouse-batt').innerText = d.mouse_batt + '%';
            document.getElementById('spot-title').innerText = d.spotify.title;
            document.getElementById('spot-artist').innerText = d.spotify.artist;
            
            upSpk(d.audio.spk.vol); upMic(d.audio.mic.vol);
            document.getElementById('icon-spk').classList.toggle('muted', d.audio.spk.muted);
            document.getElementById('icon-mic').classList.toggle('muted', d.audio.mic.muted);
            document.getElementById('btn-audio-cycle').innerText = d.audio.active_dev;
        });

        socket.on('weather_data', (d) => { document.getElementById('w-temp').innerText = d.temp + '°'; document.getElementById('w-desc').innerText = d.desc; });
        socket.on('speedtest_result', (d) => { document.getElementById('s-dl').innerText = d.down; document.getElementById('s-ul').innerText = d.up; });

        setInterval(() => {
            const d = new Date();
            document.getElementById('time').innerText = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = d.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
        }, 1000);
    </script>
</body>
</html>
